name: bots-marches

on:
  schedule:
    - cron: "*/10 * * * *"   # filet de sécurité : relance la chaîne si elle s'est arrêtée
  workflow_dispatch:

concurrency:                 # un seul lancement à la fois pour tout le workflow
  group: tradix-bots
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    name: bot ${{ matrix.bot }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bot: us,   secret: US,   delay: 0,  cycle: 285, x: US }
          - { bot: eur,  secret: EUR,  delay: 30, cycle: 255, x: EUR }
          - { bot: asia, secret: ASIA, delay: 60, cycle: 225, x: Asia }
    steps:
      - uses: actions/checkout@v4

      - name: Restaurer la mémoire des titres déjà envoyés
        uses: actions/cache/restore@v4
        with:
          path: bots/${{ matrix.bot }}/seen.json
          key: seen-${{ matrix.bot }}-none
          restore-keys: seen-${{ matrix.bot }}-

      - name: Lancer le bot (cycle de ~5 minutes)
        env:
          BOT_DIR: bots/${{ matrix.bot }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('TELEGRAM_BOT_TOKEN_{0}', matrix.secret)] }}
          TELEGRAM_CHAT_ID: ${{ secrets[format('TELEGRAM_CHAT_ID_{0}', matrix.secret)] }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CYCLE_SECONDS: ${{ matrix.cycle }}
          X_SOURCE: ${{ matrix.x }}
          X_DRAFTS_TOKEN: ${{ secrets.X_DRAFTS_TOKEN }}
          X_DRAFTS_CHAT_ID: ${{ secrets.X_DRAFTS_CHAT_ID }}
        run: |
          sleep ${{ matrix.delay }}
          python3 bot_financialjuice.py

      - name: Sauvegarder la mémoire des titres
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bots/${{ matrix.bot }}/seen.json
          key: seen-${{ matrix.bot }}-${{ github.run_id }}-${{ github.run_attempt }}

  relais:
    name: relancer le cycle suivant
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Relancer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            gh workflow run bots.yml --ref main -R ${{ github.repository }} && exit 0
            echo "Relance refusée par GitHub, nouvel essai dans 20 s"; sleep 20
          done
          exit 1
